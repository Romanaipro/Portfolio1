    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Reveal animations ── */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.65s cubic-bezier(.4,0,.2,1), transform 0.65s cubic-bezier(.4,0,.2,1);
    }
    .reveal.visible { opacity: 1; transform: none; }
    .delay-1 { transition-delay: 0.12s; }
    .delay-2 { transition-delay: 0.24s; }
    .delay-3 { transition-delay: 0.36s; }

    /* ── Hero ── */
    .hero-bg {
      background: #07101f;
      background-image:
        radial-gradient(ellipse 60% 70% at 15% 55%, rgba(8,126,164,.18) 0%, transparent 60%),

      background: linear-gradient(120deg, #38bdf8 0%, #0ea5e9 40%, #087ea4 100%);

      -webkit-text-fill-color: transparent;
      background-clip: text;

      transition: transform .3s ease, box-shadow .3s ease;
      cursor: default;

    .case-card-wrap:hover {
      transform: translateY(-6px);

      transition: all .2s;
      cursor: default;

    .tech-badge:hover { background: #087ea4; color: #fff; border-color: #087ea4; }

    /* ── Form ── */
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;

      font-family: 'Montserrat', sans-serif;
      font-size: 14px;

      background: #f8fafc;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      display: block;
    }
    .form-input:focus {
      border-color: #087ea4;
      box-shadow: 0 0 0 3px rgba(8,126,164,.12);
      background: #fff;
    }

    .contact-link { transition: background .2s; }
    .contact-link:hover { background: rgba(8,126,164,.15) !important; }

    /* ── Pricing card hover ── */
    .pricing-card-base {
      transition: box-shadow .3s, transform .3s;
    }
    .pricing-card-base:hover {
      box-shadow: 0 16px 40px rgba(0,0,0,.1) !important;
      transform: translateY(-3px);
    }

    /* ── Responsive ── */

    /* Tablet */
    @media (max-width: 1024px) {
      .pricing-layout { grid-template-columns: 1fr !important; max-width: 480px; margin: 0 auto; }
      .pricing-popular-card { transform: none !important; }
    }

    /* Mobile */
    @media (max-width: 768px) {
      .desktop-only { display: none !important; }
      .mobile-only  { display: flex !important; }

      /* Grids → single column */
      .hero-layout    { grid-template-columns: 1fr !important; gap: 32px !important; text-align: center; }
      .about-layout   { grid-template-columns: 1fr !important; gap: 40px !important; }
      .cases-layout   { grid-template-columns: 1fr !important; }
      .pricing-layout { grid-template-columns: 1fr !important; max-width: 100%; }
      .contact-layout { grid-template-columns: 1fr !important; gap: 32px !important; }
      .pricing-popular-card { transform: none !important; }

      /* Hero photo – top, centered */
      .hero-img { order: -1; justify-content: center !important; }
      .hero-img img { width: 160px !important; height: 160px !important; }
      .hero-img > div > div { width: 168px !important; height: 168px !important; }

      /* Hero text – center everything */
      .hero-badge   { justify-content: center !important; }
      .hero-btns    { justify-content: center !important; }
      .hero-stats   { justify-content: center !important; gap: 20px !important;
                      margin-top: 36px !important; padding-top: 28px !important; }

      /* Section vertical padding */
      .sec-pad { padding-top: 60px !important; padding-bottom: 60px !important; padding-left: 16px !important; padding-right: 16px !important; }
      .hero-inner { padding: 44px 16px !important; }

      /* Contact form inner box */

      /* About approach box */
      .approach-box { padding: 18px !important; }

      /* Reduce pricing gap */
      .pricing-layout { gap: 16px !important; padding-top: 8px !important; }

      /* Tech badges smaller on mobile */
      .tech-badge { font-size: 11px !important; padding: 4px 10px !important; }
      .tech-grid { grid-template-columns: 1fr !important; }
    }

    /* Extra small */
    @media (max-width: 400px) {
      .hero-stats { gap: 12px !important; }
      .hero-stats > div { min-width: 70px; }
    }

const __TWEAKS_STYLE = `

  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;

  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-field{appearance:none;width:100%;height:26px;padding:0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;
    background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  .twk-field:focus{border-color:rgba(0,0,0,.25);background:rgba(255,255,255,.85)}
  select.twk-field{padding-right:22px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");
    background-repeat:no-repeat;background-position:right 8px center}

  .twk-swatch::-moz-color-swatch{border:0;border-radius:5.5px}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((key, val) => {
    setValues((prev) => ({ ...prev, [key]: val }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakToggle, TweakRadio, TweakColor,
});
</script>

const scrollTo = (el, offset=68) => {
  if (!el) return;
  const top = el.getBoundingClientRect().top + window.pageYOffset - offset;
  window.scrollTo({ top, behavior:'smooth' });
};

/* ─── useScrollReveal ── */
const useScrollReveal = () => {
  useEffect(() => {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.08 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, []);
};

          boxShadow:popular?`0 8px 24px rgba(8,126,164,.35)`:'none',
        }}
        onMouseEnter={e=>{if(!popular){e.target.style.background=accent;e.target.style.color='#fff';}else{e.target.style.opacity='.88';}}}
        onMouseLeave={e=>{if(!popular){e.target.style.background='transparent';e.target.style.color=accent;}else{e.target.style.opacity='1';}}}
      >
        Обрати пакет
      </button>
    </div>
  );
};

const Pricing = ({ sRef, onSelect, accent }) => (
  <section ref={sRef} id="pricing" className="sec-pad" style={{background:'#fff',padding:'96px 24px'}}>
    <div style={{maxWidth:1180,margin:'0 auto'}}>
      <div className="reveal" style={{textAlign:'center',marginBottom:72}}>
        <SectionLabel text="Пакети послуг" />
        <SectionTitle text="Оберіть своє рішення" />
        <p style={{fontSize:15,color:'#64748b',marginTop:12,maxWidth:500,margin:'12px auto 0'}}>
          Інструменти та платформи підбираються індивідуально під вашу задачу
        </p>
      </div>
      <div className="pricing-layout" style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:24,alignItems:'start',paddingTop:20}}>
        {PLANS.map((p,i) => <PricingCard key={i} plan={p} onSelect={onSelect} idx={i} accent={accent} />)}
      </div>
    </div>
  </section>
);

/* ─── Contact ── */
const Contact = ({ sRef, accent }) => {
  const [form, setForm] = useState({ name:'', contact:'', description:'' });
  const [status, setStatus] = useState('idle');
  const [submitting, setSubmitting] = useState(false);
  const [savedName, setSavedName] = useState('');

  const tgFallback = () => {
    const txt = `👋 Привіт! Пишу з сайту.\n\n👤 Ім'я: ${form.name}\n📧 Контакт: ${form.contact}\n📝 Запит: ${form.description}`;
    return `https://t.me/romanmuronchuk?text=${encodeURIComponent(txt)}`;
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    setSubmitting(true);
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 10000);
      const res = await fetch(WEBHOOK, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(form),
        keepalive: true,
        signal: ctrl.signal,
      });
      clearTimeout(timer);
      if (res.ok) {
        setSavedName(form.name);
        setForm({ name:'', contact:'', description:'' });
        setStatus('success');
      } else { setStatus('error'); }
    } catch { setStatus('error'); }
    finally { setSubmitting(false); }
  };

  const inp = {
    width:'100%',padding:'12px 16px',border:'1.5px solid #e2e8f0',
    borderRadius:10,fontFamily:'Montserrat',fontSize:14,color:'#0f172a',
    background:'#f8fafc',outline:'none',display:'block',boxSizing:'border-box',
    transition:'border-color .2s, box-shadow .2s',
  };
  const lbl = { fontSize:12,fontWeight:700,color:'#374151',display:'block',marginBottom:6 };

  const CONTACTS = [
    { icon:<IconTelegram sz={20}/>, label:'Telegram', val:'@romanmuronchuk', href:'https://t.me/romanmuronchuk' },
    { icon:<IconInsta sz={20}/>,    label:'Instagram', val:'roma.ai.pro',    href:'https://www.instagram.com/roma.ai.pro?igsh=eWdneW9zZjlxeTh1' },
    { icon:<IconEmail sz={20}/>,    label:'Email',     val:'mironcukroman602@gmail.com', href:'mailto:mironcukroman602@gmail.com' },
  ];

  return (
    <section ref={sRef} id="contact" className="sec-pad" style={{background:'#07101f',padding:'96px 24px'}}>
      <div style={{maxWidth:1180,margin:'0 auto'}}>
        <div className="reveal" style={{textAlign:'center',marginBottom:64}}>
          <SectionLabel text="Контакти" light />
          <SectionTitle text="Розпочніть проект сьогодні" light />
          <p style={{fontSize:15,color:'#475569',marginTop:12}}>Розкажіть про задачу — я запропоную оптимальне рішення</p>
        </div>

        <div className="contact-layout" style={{display:'grid',gridTemplateColumns:'1fr 1.5fr',gap:56,alignItems:'start'}}>

          {/* Contacts */}
          <div className="reveal" style={{display:'flex',flexDirection:'column',gap:14}}>
            {CONTACTS.map(c => (
              <a key={c.label} href={c.href} target="_blank" rel="noopener noreferrer" className="contact-link"
                style={{display:'flex',alignItems:'center',gap:14,textDecoration:'none',padding:'18px 20px',borderRadius:16,background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.07)'}}>
                <div style={{width:44,height:44,borderRadius:12,background:'rgba(8,126,164,.2)',display:'flex',alignItems:'center',justifyContent:'center',color:'#38bdf8',flexShrink:0}}>
                  {c.icon}
                </div>
                <div>
                  <div style={{fontSize:11,color:'#475569',fontWeight:700,textTransform:'uppercase',letterSpacing:1}}>{c.label}</div>
                  <div style={{fontSize:14,color:'#fff',fontWeight:600,marginTop:2}}>{c.val}</div>
                </div>
              </a>
            ))}

            <div style={{marginTop:8,padding:20,borderRadius:16,background:'rgba(8,126,164,.08)',border:'1px solid rgba(8,126,164,.2)'}}>
              <div style={{color:'#38bdf8',fontSize:12,fontWeight:700,marginBottom:8,textTransform:'uppercase',letterSpacing:1}}>⏱ Час відповіді</div>
              <div style={{color:'#64748b',fontSize:14,lineHeight:1.65}}>
                Зазвичай відповідаю протягом кількох годин. Для термінових задач — Telegram.
              </div>
            </div>
          </div>

          {/* Form */}
          <div className="reveal delay-1">
            <div className="form-box" style={{background:'#fff',borderRadius:20,padding:'36px 40px'}}>
              {status === 'success' ? (
                <div style={{textAlign:'center',padding:'16px 0'}}>
                  <div style={{width:68,height:68,borderRadius:'50%',background:'#ecfdf5',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 20px',fontSize:28}}>✅</div>
                  <h3 style={{fontSize:22,fontWeight:800,color:'#0f172a',margin:'0 0 10px'}}>Дякую, {savedName}!</h3>
                  <p style={{color:'#64748b',lineHeight:1.65,marginBottom:24}}>Запит надіслано. Зв'яжусь найближчим часом.</p>
                  <button onClick={() => setStatus('idle')}
                    style={{border:`2px solid ${accent}`,background:'transparent',color:accent,padding:'10px 24px',borderRadius:9,fontFamily:'Montserrat',fontWeight:700,fontSize:14,cursor:'pointer'}}>
                    Надіслати ще
                  </button>
                </div>
              ) : (
                <form onSubmit={handleSubmit}>
                  {status === 'error' && (
                    <div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:10,padding:14,marginBottom:18,textAlign:'center'}}>
                      <p style={{color:'#dc2626',fontSize:13,margin:'0 0 8px'}}>Помилка відправлення.</p>
                      <a href={tgFallback()} target="_blank" rel="noopener noreferrer" style={{color:accent,fontWeight:700,fontSize:13}}>
                        Надіслати через Telegram →
                      </a>
                    </div>
                  )}
                  <div style={{marginBottom:18}}>
                    <label style={lbl}>Ім'я</label>
                    <input className="form-input" style={inp} type="text" value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} required disabled={submitting} placeholder="Ваше ім'я" />
                  </div>
                  <div style={{marginBottom:18}}>
                    <label style={lbl}>Email / Telegram</label>
                    <input className="form-input" style={inp} type="text" value={form.contact} onChange={e=>setForm(p=>({...p,contact:e.target.value}))} required disabled={submitting} placeholder="@username або email" />
                  </div>
                  <div style={{marginBottom:24}}>
                    <label style={lbl}>Опис задачі</label>
                    <textarea className="form-input" style={{...inp,resize:'vertical',minHeight:110}} value={form.description} onChange={e=>setForm(p=>({...p,description:e.target.value}))} required disabled={submitting} rows={4} placeholder="Розкажіть про вашу задачу..." />
                  </div>
                  <button type="submit" disabled={submitting}
                    style={{
                      width:'100%',padding:'15px 20px',
                      background:submitting?'#94a3b8':`linear-gradient(135deg,${accent},#0ea5c9)`,
                      color:'#fff',border:'none',borderRadius:10,
                      fontFamily:'Montserrat',fontSize:15,fontWeight:700,
                      cursor:submitting?'not-allowed':'pointer',
                      boxShadow:submitting?'none':`0 8px 24px rgba(8,126,164,.35)`,
                      transition:'opacity .2s, box-shadow .2s',
                    }}>
                    {submitting ? 'Відправляємо...' : 'Надіслати запит →'}
                  </button>
                </form>
              )}
            </div>
          </div>

        </div>
      </div>
    </section>
  );
};

/* ─── App ── */
const TWEAK_DEFAULTS = {
  accentColor: '#087ea4',
  showBadge: true,
  cardStyle: 'shadow',
};

const App = () => {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const accent = t.accentColor;

  const refs = {
    about:   useRef(null),
    cases:   useRef(null),
    pricing: useRef(null),
    contact: useRef(null),
  };

  const [active, setActive] = useState('');

  useScrollReveal();

  useEffect(() => {
    const fn = () => {
      const order = ['contact','pricing','cases','about'];
      for (const key of order) {
        const el = refs[key]?.current;
        if (!el) continue;
        if (el.getBoundingClientRect().top <= 90) { setActive(key); return; }
      }
      setActive('');
    };
    window.addEventListener('scroll', fn, { passive: true });
    return () => window.removeEventListener('scroll', fn);
  }, []);

  const onNav = (key) => {
    scrollTo(refs[key]?.current);
    setActive(key);
  };

  return (
    <div>
      <Header onNav={onNav} active={active} accent={accent} />
      <main>
        <Hero onCTA={() => onNav('contact')} accent={accent} />
        <About sRef={refs.about} accent={accent} />
        <Cases sRef={refs.cases} accent={accent} />
        <Pricing sRef={refs.pricing} onSelect={() => onNav('contact')} accent={accent} />
        <Contact sRef={refs.contact} accent={accent} />
      </main>
      <footer style={{background:'#040a14',textAlign:'center',padding:'28px 24px',borderTop:'1px solid rgba(255,255,255,.04)'}}>
        <p style={{color:'#1e293b',fontSize:13}}>© {new Date().getFullYear()} Roman Myronchuk. Усі права захищено.</p>
      </footer>

      <TweaksPanel>
        <TweakSection label="Кольори" />
        <TweakColor label="Акцентний колір" value={t.accentColor} onChange={v => setTweak('accentColor', v)} />
        <TweakSection label="Вигляд" />
        <TweakToggle label="Показувати AI бейдж" value={t.showBadge} onChange={v => setTweak('showBadge', v)} />
        <TweakRadio label="Стиль карток" value={t.cardStyle} options={['shadow','border','flat']} onChange={v => setTweak('cardStyle', v)} />
      </TweaksPanel>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
